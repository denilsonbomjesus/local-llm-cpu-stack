# =================================================================
# 🍽️ CARDÁPIO DE IA — n8n e outras ferramentas externas
# =================================================================
# Todos os modelos (texto, código e VISÃO) passam pelo GATEWAY (Porta 9000).
# A rota é SEMPRE /v1/chat/completions (formato OpenAI).
#
#   ✅ Texto/Código:   messages com { role, content: "..." }
#   ✅ Visão:          messages com { role, content: [
#                        { "type": "image_url", "image_url": { "url": "file:///caminho/img.jpg" } },
#                        { "type": "text", "text": "Descreva esta imagem" }
#                      ] }
#
# O gateway encaminha para a porta certa com base no campo "model".
# =================================================================
models:

  # ─────────────────────────────────────────────
  # 📝 TEXTO / CHAT
  # ─────────────────────────────────────────────
  dolphin3-3b:
    endpoint: http://localhost:9000/v1/chat/completions
  bonsai-27b:
    endpoint: http://localhost:9000/v1/chat/completions
  bonsai-27b-nothink:
    endpoint: http://localhost:9000/v1/chat/completions
  ternary-bonsai-27b:
    endpoint: http://localhost:9000/v1/chat/completions
  ternary-bonsai-27b-nothink:
    endpoint: http://localhost:9000/v1/chat/completions

  # ─────────────────────────────────────────────
  # 💻 CÓDIGO
  # ─────────────────────────────────────────────
  qwen-coder-3b:
    endpoint: http://localhost:9000/v1/chat/completions
  lfm2.5-1.2b:
    endpoint: http://localhost:9000/v1/chat/completions
  nanbeige-3b:
    endpoint: http://localhost:9000/v1/chat/completions
  nanbeige-3b-nothink:
    endpoint: http://localhost:9000/v1/chat/completions
  minicpm5-1b:
    endpoint: http://localhost:9000/v1/chat/completions
  minicpm5-1b-nothink:
    endpoint: http://localhost:9000/v1/chat/completions

  # ─────────────────────────────────────────────
  # 👁️ VISÃO (multimodal — aceitam image_url)
  # Todos estes modelos podem ser chamados pelo gateway
  # com o mesmo endpoint + formato OpenAI de imagem.
  # ─────────────────────────────────────────────
  qwen-vl-3b-uncensored:
    endpoint: http://localhost:9000/v1/chat/completions
  gemma-4-e2b-vision:
    endpoint: http://localhost:9000/v1/chat/completions
  gemma-4-e2b-vision-nothink:
    endpoint: http://localhost:9000/v1/chat/completions
  gemma-4-e4b-vision:
    endpoint: http://localhost:9000/v1/chat/completions
  gemma-4-e4b-vision-nothink:
    endpoint: http://localhost:9000/v1/chat/completions

  # ─────────────────────────────────────────────
  # 🧠 TEXTO COM THINKING (Gemma 4)
  # ─────────────────────────────────────────────
  gemma-4-e2b:
    endpoint: http://localhost:9000/v1/chat/completions
  gemma-4-e2b-nothink:
    endpoint: http://localhost:9000/v1/chat/completions
  gemma-4-e4b:
    endpoint: http://localhost:9000/v1/chat/completions
  gemma-4-e4b-nothink:
    endpoint: http://localhost:9000/v1/chat/completions

# =================================================================
# 📘 EXEMPLOS DE USO NA PRÁTICA (N8N OU OUTRO SERVIÇO)
# =================================================================

# Centralização: Você sempre aponta para http://localhost:9000/v1/chat/completions
# e só troca o campo "model" para alternar entre os modelos.

# ── EXEMPLO 1: Texto (nó HTTP do n8n) ────────────────────────────
# POST http://localhost:9000/v1/chat/completions
# {
#   "model": "qwen-coder-3b",
#   "messages": [
#     { "role": "user", "content": "Corrija este código Python..." }
#   ]
# }

# ── EXEMPLO 2: VISÃO — escolha QUALQUER modelo de visão ─────────
# POST http://localhost:9000/v1/chat/completions
# {
#   "model": "qwen-vl-3b-uncensored",   # ou gemma-4-e2b-vision, gemma-4-e4b-vision...
#   "messages": [
#     {
#       "role": "user",
#       "content": [
#         { "type": "image_url", "image_url": { "url": "file:///home/denilsonbj/foto.jpg" } },
#         { "type": "text", "text": "Descreva esta imagem em detalhes." }
#       ]
#     }
#   ],
#   "max_tokens": 256
# }

# ── EXEMPLO 3: Streaming (para agentes/OpenWebUI) ────────────────
# Adicione "stream": true no corpo — o gateway repassa o SSE.
