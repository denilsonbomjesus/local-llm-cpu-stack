version = 1

; ============================================================================
; Preset de modelos para a WebUI do llama.cpp (modo router)
; Usado por: ./scripts/webui.sh  →  llama-server --models-preset <este arquivo>
;
; Cada seção [id] vira um modelo selecionável na interface (port 8080).
; O id NO ARQUIVO deve bater com o nome do arquivo/pasta em models/, senão
; é preciso declarar "model =" apontando para o GGUF.
;
; Convenções do projeto (iguais às de manage.sh/chat.sh):
;   threads = 8 (i5-1235U), batch 256
;   -nothink  → reasoning = off  (respostas diretas, sem <think>)
;   -vision   → mmproj = <arquivo>  (suporte a imagens)
;
; Nota: os nomes das seções são curtos no lugar dos paths com versão
; (ex.: gemma-4-e2b em vez de gemma-4-E2B_q4_0-it) porque o id da seção
; precisa corresponder ao arquivo em models/ para o router encontrá-lo.
; ============================================================================

[*]
; Valores globais herdados por todos os modelos (podem ser sobrescritos por seção)
threads = 8
batch-size = 256
ctx-size = 4096

; ---------------- Texto (Gemma 4 + Dolphin) ----------------

[gemma-4-e2b]
model = /home/denilsonbj/llm-stack/models/text/gemma-4-E2B_q4_0-it.gguf

[gemma-4-e2b-nothink]
model = /home/denilsonbj/llm-stack/models/text/gemma-4-E2B_q4_0-it.gguf
reasoning = off

